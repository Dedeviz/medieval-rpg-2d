<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frostbite Keep</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="title-panel">
          <h1>FROSTBITE KEEP</h1>
          <div id="areaName">Valle di Brinco</div>
        </div>
        <div class="stats">
          <span>HP <strong id="hpValue">100 / 100</strong></span>
          <span>LV <strong id="levelValue">1</strong></span>
          <span>XP <strong id="xpValue">0 / 10</strong></span>
          <span>GOLD <strong id="goldValue">0</strong></span>
          <span>WEAPON <strong id="weaponValue">Spada Arrugginita</strong></span>
        </div>
      </div>

      <canvas id="gameCanvas" width="960" height="640" aria-label="Game area"></canvas>

      <div class="legend">
        <span>WASD / Frecce</span>
        <span>SPAZIO = attacco</span>
        <span>E = usa pozione</span>
        <span>Raggiungi la scala per avanzare</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
